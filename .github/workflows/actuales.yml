name: Datos reales del calendario

on:
  schedule:
    # Franjas: cada media hora (minutos 22 y 52, de 08:22 a 19:52 UTC) el trabajo mira si hay un dato automático
    # a punto de publicarse (desde 12 min antes hasta 20 min después de su hora). Si no hay nada, termina en segundos.
    # Si lo hay, espera hasta 3 minutos después de la hora del evento y reintenta cada 45 s.
    - cron: '22,52 8-19 * * 1-5'
    # Barrido de recogida (por si alguna franja se retrasó): dos veces al día.
    - cron: '5 7,21 * * 1-5'
  workflow_dispatch:
    inputs:
      sonda:
        description: 'Modo de prueba: lee los últimos datos y los guarda en sonda.json'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actuales
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar datos publicados
        env:
          BLS_KEY: ${{ secrets.BLS_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          EVENTO: ${{ github.event.schedule }}
          SONDA: ${{ inputs.sonda }}
        run: |
          if [ "$SONDA" = "true" ]; then
            python scripts/actualizar_actuales.py --sonda || true
            bash scripts/guardar.sh
          elif [ "$EVENTO" = "22,52 8-19 * * 1-5" ]; then
            python scripts/actualizar_actuales.py --ventana || true
            bash scripts/guardar.sh
          else
            python scripts/actualizar_actuales.py || true
            bash scripts/guardar.sh
          fi
